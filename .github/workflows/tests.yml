name: core-tests

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: core/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests with coverage
        run: pytest --cov=app --cov-report=term-missing

      - name: Enforce service-layer coverage floor
        run: |
          pytest \
            --cov=app.services.plugin_installer --cov=app.services.plugin_runtime \
            --cov=app.services.plugin_registry --cov=app.services.plugin_proxy \
            --cov-report=term \
            --cov-fail-under=75